services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nby_church
      POSTGRES_USER: nby
      POSTGRES_PASSWORD: nby_change_me
    ports:
      - "5432:5432"
    volumes:
      - nby_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nby -d nby_church"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - nby_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: nby_church
      DATABASE_USER: nby
      DATABASE_PASSWORD: nby_change_me
      REDIS_URL: redis://redis:6379
      JWT_SECRET: replace-this-secret-before-production-123456
      ADMIN_EMAIL: admin@nby-citedusurnaturel.org
      ADMIN_PASSWORD: ChangeMe123!
      ADMIN_SITE_URL: http://localhost:3001
      PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backoffice:
    build:
      context: ./backoffice
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3001:3001"
    depends_on:
      - backend

  website:
    build:
      context: ./website
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  nby_postgres:
  nby_redis:
